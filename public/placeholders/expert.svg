<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <circle cx="400" cy="420" r="160" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="400" cy="420" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <text x="400" y="450" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">ДТ</text>
  <text x="400" y="640" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.35" text-anchor="middle" letter-spacing="2">ФОТО ЭКСПЕРТА · ЗАГЛУШКА</text>
</svg>
